[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotrec"
version = "0.1.6"
description = "Screen and sound recorder for GNOME on Wayland, driven by keyboard shortcuts"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TrenSoft" }]
# GTK 3 and an AppIndicator library are needed for the top bar dot only; they come from the
# distribution (python3-gobject), not from PyPI.

[project.scripts]
hotrec = "hotrec.cli:main"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
include = ["hotrec*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
